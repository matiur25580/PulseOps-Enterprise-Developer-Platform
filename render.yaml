databases:
  - name: pulseops-test-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: pulseops-api-test
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack pnpm@10.4.1 install --no-frozen-lockfile && corepack pnpm@10.4.1 --filter @pulseops/api exec prisma migrate deploy && corepack pnpm@10.4.1 --filter @pulseops/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulseops-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
