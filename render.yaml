databases:
  - name: pulseops-test-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: pulseops-api-test
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @pulseops/api exec prisma migrate deploy && pnpm --filter @pulseops/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: WEB_ORIGIN
        value: http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: pulseops-test-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
