name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulseops_test
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pulseops:pulseops_test_password@localhost:5432/pulseops_test?schema=public
      JWT_SECRET: ci-only-test-secret-change-before-production
      WEB_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm --filter @pulseops/api prisma:validate
      - name: Apply test database schema
        run: pnpm --filter @pulseops/api exec prisma db push
      - name: Run API unit tests
        run: pnpm test:api
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
      - name: Build applications
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @pulseops/web exec playwright install --with-deps chromium
      - name: Start API
        run: |
          (pnpm dev:api > /tmp/pulseops-api.log 2>&1 &)
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:4000/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/pulseops-api.log
          exit 1
      - name: Start web application
        run: |
          (pnpm --filter @pulseops/web start > /tmp/pulseops-web.log 2>&1 &)
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:3000; then exit 0; fi
            sleep 2
          done
          cat /tmp/pulseops-web.log
          exit 1
      - name: Run browser-level UI tests
        run: pnpm test:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
