name: Production Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'apps/web/e2e/api-connectivity.spec.ts'
      - 'apps/web/playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://pulse-ops-enterprise-developer-plat.vercel.app
      NEXT_PUBLIC_API_BASE_URL: https://pulseops-api-test.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @pulseops/web exec playwright install --with-deps chromium
      - name: Wait for production endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL" >/dev/null && curl --fail --silent "$NEXT_PUBLIC_API_BASE_URL/api/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production frontend or API did not become healthy in time."
          exit 1
      - name: Verify real production browser-to-API CORS
        run: pnpm test:browser
